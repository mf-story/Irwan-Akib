<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Situs profil Prof. Dr. H. Irwan Akib, M.Pd. — Guru Besar Ilmu Pendidikan Matematika: biografi, karier, pendidikan, karya ilmiah, dan ruang tulisan." />
  <title>Irwan Akib — Guru Besar Ilmu Pendidikan Matematika</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="scroll-progress" id="scrollProgress"></div>

  <header class="navbar" id="navbar">
    <div class="container nav-inner">
      <a href="#hero" class="brand">
        <span class="brand-badge">IA</span>
        <span class="brand-name">Irwan Akib<small>Prof. Dr. H. · M.Pd.</small></span>
      </a>
      <nav class="nav-links" id="navLinks">
        <a href="#hero">Beranda</a>
        <a href="#about">Fokus</a>
        <a href="#profile">Tentang</a>
        <a href="#experience">Perjalanan</a>
        <a href="#education">Pendidikan</a>
        <a href="#works">Karya</a>
        <a href="tulisan.html">Tulisan</a>
        <a href="#contact" class="nav-cta">Kontak</a>
      </nav>
      <button class="nav-toggle" id="navToggle" aria-label="Buka menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <!-- HERO: gelap + overlay foto -->
  <section class="hero" id="hero">
    <div class="hero-bg"></div>
    <div class="hero-overlay"></div>
    <div class="container hero-inner">
      <div class="hero-text reveal"></div>
    </div>
    <div class="hero-scroll"><span></span></div>
  </section>

  <!-- FITUR / FOKUS KEAHLIAN -->
  <section class="section" id="about">
    <div class="container">
      <div class="section-head center reveal" id="aboutHead"></div>
      <div class="feature-grid reveal" id="aboutCards"></div>
    </div>
  </section>

  <!-- TENTANG (bio + foto) -->
  <section class="section section-alt" id="profile">
    <div class="container profile-grid">
      <div class="profile-photo reveal" id="profilePhoto"></div>
      <div class="profile-text reveal" id="profileText"></div>
    </div>
  </section>

  <!-- PERJALANAN -->
  <section class="section" id="experience">
    <div class="container">
      <div class="section-head center reveal" id="experienceHead"></div>
      <div class="timeline reveal" id="experienceList"></div>
    </div>
  </section>

  <!-- PENDIDIKAN -->
  <section class="section section-alt" id="education">
    <div class="container">
      <div class="section-head center reveal" id="educationHead"></div>
      <div class="edu-grid reveal" id="educationList"></div>
      <div id="focusBlock"></div>
    </div>
  </section>

  <!-- KARYA ILMIAH -->
  <section class="section" id="works">
    <div class="container" id="worksBody"></div>
  </section>

  <!-- GALERI FOTO -->
  <section class="section" id="gallery">
    <div class="container">
      <div class="section-head center reveal" id="galleryHead"></div>
      <div class="gallery-grid reveal" id="galleryGrid"></div>
    </div>
  </section>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" hidden>
    <button class="lb-close" id="lbClose" aria-label="Tutup">✕</button>
    <button class="lb-nav lb-prev" id="lbPrev" aria-label="Sebelumnya">‹</button>
    <button class="lb-nav lb-next" id="lbNext" aria-label="Selanjutnya">›</button>
    <figure class="lb-figure">
      <img id="lbImage" alt="" />
      <figcaption id="lbCaption"></figcaption>
    </figure>
  </div>

  <section class="section" id="writings">
    <div class="container">
      <div class="section-head center reveal" id="writingsHead"></div>
      <div class="writings-grid" id="writingsGrid"></div>
      <div class="writings-more reveal center" id="writingsMore"></div>
    </div>
  </section>

  <!-- KONTAK -->
  <section class="section section-alt" id="contact">
    <div class="container">
      <div class="section-head center reveal" id="contactHead"></div>
      <div class="contact-grid">
        <div class="contact-info reveal" id="contactInfo"></div>
        <form class="contact-form reveal" id="contactForm" novalidate>
          <div class="field">
            <input type="text" id="name" name="name" placeholder=" " required />
            <label for="name">Nama Anda</label>
          </div>
          <div class="field">
            <input type="email" id="email" name="email" placeholder=" " required />
            <label for="email">Email Anda</label>
          </div>
          <div class="field">
            <textarea id="message" name="message" placeholder=" " required></textarea>
            <label for="message">Pesan</label>
          </div>
          <button type="submit" class="btn btn-primary btn-full">Kirim Pesan</button>
          <p class="form-note" id="formNote"></p>
        </form>
      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="container footer-inner">
      <p>© <span id="year"></span> <span id="footerText">Prof. Dr. H. Irwan Akib, M.Pd.</span></p>
      <a href="#hero" class="to-top">↑ Ke atas</a>
    </div>
  </footer>

  <script src="main.js"></script>
</body>
</html>
